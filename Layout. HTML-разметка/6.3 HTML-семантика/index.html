<body>
    Семантика - правильная структура тегов 

    <!-- ⁡⁢⁢⁢Специальная семантические теги помимо⁡ ⁡⁢⁣⁢<div>⁡:
        1. ⁡⁢⁣⁢<header>⁡ - шапка сайта с логотипом, название и навигацией

        2. ⁡⁢⁣⁢<nav>⁡ - меню навигации

        3. ⁡⁢⁣⁢<main>⁡ - все что есть на сайте между ⁡⁢⁣⁣<header>⁡ и ⁡⁢⁣⁣<footer>⁡

        4. ⁡⁢⁣⁢<section>⁡ - отдельные секции (например с отзывами, контактами)

        5. ⁡⁢⁣⁢<article>⁡ - обособленная, независимая единица, но отличие от ⁡⁢⁣⁣<section>⁡ в том,
            что этот тег можно перенести в любую часть сайта и ничего не сломается (виджет с погодой)

        6. ⁡⁢⁣⁢<aside>⁡ - боковая панель для контента, который косвенно связан с основым содержимым

        7. ⁡⁢⁣⁢<footer>⁡ - тот же ⁡⁢⁣⁣<header>⁡, но внизу для контаков, прав и так далее
        
        8. ⁡⁢⁣⁢<time>⁡ - дата создания статьи 
        9. ⁡⁢⁣⁢<address>⁡ - адрес, контактная информация, если адрес не относится к компании, то
            ⁡⁣⁣⁢лучше использовать <span>⁡ -->

</body>
</html>
