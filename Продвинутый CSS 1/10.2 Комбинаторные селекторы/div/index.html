<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Селектор по запятой</title>
</head>

<body>
    <h2>Селектор по запятой</h2>
    <div class="parent parent-1">
        <div class="child child1"></div>
        <div class="child child2"></div>
    </div>

    <h2>Селектор "пробел"</h2>
    <div class="parent parent-2">
        <div class="child child1"></div>
        <div class="child child2"></div>
    </div>

    <h2>Дочерний селектор</h2>
    <div class="parent parent-3">
        <div class="child"></div>
        <div class="child">
          <div class="child"></div>
        </div>  
    </div>

    <h2>Все соседние элементы</h2>
    <div class="parent parent-4">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child child-5"></div>
    </div>

    <h2>Следующий элемент</h2>
    <div class="parent parent-5">
        <div class="child"></div>
        <div class="child child-6"></div>
        <div class="child"></div>
    </div>

</body>

</html>
