<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <picture>
        <source srcset="img/default2x.jpg 2x" width = "800">
        <img src="img/default.jpg" alt="My default image" width="800">
    </picture>
</body>
</html>

<!-- srcset="img/default2x.jpg 2x" - 2x - значит, что на экране с большим количеством пикселей загрузится
именно улучшенная в разрешении картинка -->

<!-- загрузка изображений идёт сверху вниз -->
