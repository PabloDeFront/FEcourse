<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="https://jsonplaceholder.typicode.com/posts" method="post">

        <fieldset>
            <legend>Выбор пола</legend>
            <label>
                <input type="radio" name="gender" value="Мужской пол">Мужской пол
            </label>

            <input type="radio" name="gender" value="Женский пол" checked>Женский пол
            <input type="radio" name="gender" value="Другой пол">Другой пол

            <textarea name="message" placeholder="Введите сообщение"></textarea>

            <select name="city">
                <option value="Мурманск">Мурманск</option>
                <option value="Санкт-Петербург">Санкт-Петербург</option>
                <option value="Москва" disabled>Москва</option>
            </select>
        </fieldset>

        <label>
            <input type="radio" name="gender" value="Мужской пол">Мужской пол
        </label>

        <input type="radio" name="gender" value="Женский пол" checked>Женский пол
        <input type="radio" name="gender" value="Другой пол">Другой пол

        <textarea name="message" placeholder="Введите сообщение"></textarea>

        <select name="city">
            <option value="Мурманск">Мурманск</option>
            <option value="Санкт-Петербург">Санкт-Петербург</option>
            <option value="Москва" disabled>Москва</option>
        </select>

        <button type="submit">Отправить</button>
    </form>
</body>

</html>

    ⁡⁢⁣⁣𝗰𝗵𝗲𝗰𝗸𝗲𝗱⁡ - атрибут - ⁡⁢⁢⁣кнопка сразу выбрана⁡ -->

 в таком случае выбрать можно только 𝟭 пункт и выбор происходит в этой группе полей -->
    <!-- ⁡⁢⁣⁣𝘃𝗮𝗹𝘂𝗲⁡ - атрибут - то ⁡⁢⁢⁣что отправится на сервер⁡ -->
