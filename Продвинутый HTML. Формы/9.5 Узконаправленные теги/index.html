<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <base target="_blank">
</head>

<body>
    <details>
        <summary>Кто убийца?</summary>
        Убийца - дворецкий
    </details>

    <p>
        Какой-то текст, и <mark>выделенный</mark> в нём фрагмент
    </p>

    <blockquote cite="https://skillbox.ru">
        <p>
            Тег &lt;tr&gt; образует контейнер
        </p>
    </blockquote>
</body>

</html>

<!-- <base target="_blank"> - все ссылки на сайте будут открываться
в новых окнах -->

        <summary>Кто убийца?</summary>
        Убийца - дворецкий
</details> - всё это спойлер, то есть выезжающий текст -->

<!-- <mark> - по умолчанию выделяет текст жёлтым цветом -->

<!-- <blockquote> - цитата для больших текстов -->
